[project]
name = "nexla-cli"
version = "0.3.1"
description = "Command-line client for the Nexla agent API."
readme = "README.md"
# Same MIT license already declared for this codebase in npm/package.json.
license = "MIT"
authors = [{ name = "Nexla, Inc.", email = "abhishek.kumar@nexla.com" }]
requires-python = ">=3.12"
# Typer 0.26.0 is the first release that vendors its own private Click fork
# as `typer._click` (earlier releases depend on standalone `click` and have
# no `_click` module). We import from `typer._click` (see src/nexla_cli),
# so the floor must be 0.26.0. Because that module is private and could be
# moved/renamed in any future release, we also cap below the next minor.
dependencies = ["typer>=0.26.0,<0.27.0", "httpx>=0.28.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/nexla-opensource/nexla-agent-cli"
Repository = "https://github.com/nexla-opensource/nexla-agent-cli"
Issues = "https://github.com/nexla-opensource/nexla-agent-cli/issues"

[project.scripts]
nexla-cli = "nexla_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
    "ruff>=0.15.12",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexla_cli"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Default (E4/E7/E9/F) plus import-sort, pyupgrade, bugbear, simplify.
# E501 line-length is intentionally left to the formatter, not enforced
# per-line. B008 is ignored: Typer *requires* calls (typer.Option/Argument)
# in parameter defaults, which B008 flags by design.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
